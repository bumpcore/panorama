name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            laravel-version: '^12.0'
          - php-version: '8.3'
            laravel-version: '^12.0'
          - php-version: '8.4'
            laravel-version: '^12.0'
          - php-version: '8.5'
            laravel-version: '^12.0'
          - php-version: '8.3'
            laravel-version: '^13.0'
          - php-version: '8.4'
            laravel-version: '^13.0'
          - php-version: '8.5'
            laravel-version: '^13.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov

      - run: composer require illuminate/database:${{ matrix.laravel-version }} --no-update --no-interaction

      - run: composer install --no-interaction --prefer-dist

      - run: composer test

      - run: composer test:coverage
